<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620">
  <!-- OllJira network artwork for page headers: enlarged hub motif with connected nodes -->
  <g fill="none">
    <!-- long connection lines -->
    <g stroke="#0B2E4F" stroke-width="5" opacity="0.55">
      <line x1="340" y1="330" x2="120" y2="110"/>
      <line x1="340" y1="330" x2="580" y2="140"/>
      <line x1="340" y1="330" x2="620" y2="420"/>
      <line x1="340" y1="330" x2="150" y2="520"/>
      <line x1="340" y1="330" x2="60" y2="330"/>
      <line x1="340" y1="330" x2="430" y2="560"/>
    </g>
    <!-- big navy donut ring -->
    <path fill="#0B2E4F" fill-rule="evenodd" opacity="0.92" d="M340 170a160 160 0 1 1 0 320 160 160 0 0 1 0-320zm0 76a84 84 0 1 1 0 168 84 84 0 0 1 0-168z"/>
    <!-- ring notches -->
    <g fill="#F4F6F8">
      <rect x="432" y="196" width="58" height="58" rx="8" transform="rotate(45 461 225)"/>
      <rect x="432" y="376" width="58" height="58" rx="8" transform="rotate(45 461 405)"/>
      <rect x="190" y="376" width="58" height="58" rx="8" transform="rotate(45 219 405)"/>
      <rect x="190" y="196" width="58" height="58" rx="8" transform="rotate(45 219 225)"/>
    </g>
    <!-- spoke stubs -->
    <g stroke="#0B2E4F" stroke-width="8" opacity="0.92">
      <line x1="444" y1="236" x2="453" y2="227"/>
      <line x1="444" y1="424" x2="453" y2="433"/>
      <line x1="236" y1="424" x2="227" y2="433"/>
      <line x1="236" y1="236" x2="227" y2="227"/>
    </g>
    <!-- ring nodes -->
    <g fill="#0B2E4F">
      <circle cx="461" cy="225" r="15"/>
      <circle cx="461" cy="405" r="15"/>
      <circle cx="219" cy="405" r="15"/>
      <circle cx="219" cy="225" r="15"/>
    </g>
    <!-- outer satellite nodes -->
    <g fill="#0B2E4F" opacity="0.75">
      <circle cx="120" cy="110" r="12"/>
      <circle cx="580" cy="140" r="12"/>
      <circle cx="620" cy="420" r="12"/>
      <circle cx="150" cy="520" r="12"/>
      <circle cx="60" cy="330" r="12"/>
      <circle cx="430" cy="560" r="12"/>
    </g>
    <!-- orange hub -->
    <circle cx="340" cy="330" r="32" fill="#F28C28"/>
    <!-- small orange accent node -->
    <circle cx="580" cy="140" r="5" fill="#F28C28"/>
    <circle cx="150" cy="520" r="5" fill="#F28C28"/>
  </g>
</svg>
